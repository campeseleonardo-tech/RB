<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dance Scene Atlas</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --fg: #15181d;
    --muted: #4d5563;
    --line: #d3d8e0;
    --accent: #1f4e8c;
    --ok: #1d6b3a;
    --ok-bg: #d9f0e1;
    --warn: #7a4b00;
    --warn-bg: #fdebc0;
    --bad: #8a1c1c;
    --bad-bg: #f7d4d4;
    --nf: #4d5563;
    --nf-bg: #e4e7ec;
    --land: #dfe3ea;
    --sea: #eef4fb;
    --banner-bg: #ffe27a;
    --banner-fg: #3d2b00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13161b;
      --panel: #1b1f26;
      --fg: #eceef2;
      --muted: #b3bac6;
      --line: #3a414d;
      --accent: #8fb8ea;
      --ok: #9be0b3;
      --ok-bg: #173424;
      --warn: #f2d28a;
      --warn-bg: #3d2e0c;
      --bad: #f2a6a6;
      --bad-bg: #411c1c;
      --nf: #b3bac6;
      --nf-bg: #2a2f38;
      --land: #2c323c;
      --sea: #181c22;
      --banner-bg: #5c4a00;
      --banner-fg: #fff3c4;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13161b;
    --panel: #1b1f26;
    --fg: #eceef2;
    --muted: #b3bac6;
    --line: #3a414d;
    --accent: #8fb8ea;
    --ok: #9be0b3;
    --ok-bg: #173424;
    --warn: #f2d28a;
    --warn-bg: #3d2e0c;
    --bad: #f2a6a6;
    --bad-bg: #411c1c;
    --nf: #b3bac6;
    --nf-bg: #2a2f38;
    --land: #2c323c;
    --sea: #181c22;
    --banner-bg: #5c4a00;
    --banner-fg: #fff3c4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh;
         font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 15px; line-height: 1.45; }
  a { color: var(--accent); }
  h1 { font-size: 1.35rem; margin: 0.2rem 0 0.4rem; }
  h2 { font-size: 1.1rem; margin: 1.4rem 0 0.4rem; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  h3 { font-size: 1rem; margin: 1rem 0 0.3rem; }
  h4 { font-size: 0.92rem; margin: 0.8rem 0 0.2rem; }
  code, .code { font-family: Consolas, "Courier New", monospace; font-size: 0.85em; color: var(--muted); }
  .muted { color: var(--muted); }
  .note { color: var(--muted); font-size: 0.9rem; }
  .small { font-size: 0.85rem; }
  .warn { color: var(--warn); background: var(--warn-bg); padding: 6px 10px; border-radius: 4px; }
  .sample-banner { background: var(--banner-bg); color: var(--banner-fg); font-weight: 700;
                   padding: 10px 16px; text-align: center; letter-spacing: 0.02em; }

  /* shell */
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px;
         padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { font-weight: 700; font-size: 1.05rem; }
  .built { font-size: 0.8rem; }
  .layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: calc(100vh - 60px); }
  .menu { display: flex; flex-direction: column; gap: 2px; padding: 12px 8px; border-right: 1px solid var(--line); background: var(--panel); }
  .menu a { text-decoration: none; color: var(--fg); padding: 7px 10px; border-radius: 6px; }
  .menu a:hover { background: var(--bg); }
  .menu a.on { background: var(--accent); color: var(--panel); font-weight: 600; }
  .main { padding: 14px 18px 40px; min-width: 0; }
  .main p { max-width: 900px; }

  /* overview */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 8px 0; }
  .card { display: flex; flex-direction: column; text-decoration: none; color: var(--fg); background: var(--panel);
          border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .card-n { font-size: 1.4rem; font-weight: 700; }
  .card-t { color: var(--muted); font-size: 0.85rem; }
  .bars { max-width: 720px; }
  .bar-row { display: grid; grid-template-columns: 180px 1fr 60px; align-items: center; gap: 8px; margin: 3px 0; }
  .bar-track { background: var(--nf-bg); height: 14px; border-radius: 3px; overflow: hidden; }
  .bar-fill { display: block; height: 100%; background: var(--accent); }
  .bar-val { text-align: right; font-variant-numeric: tabular-nums; }
  .mini-bar { width: 120px; height: 6px; background: var(--nf-bg); border-radius: 3px; overflow: hidden; margin: 2px 0; }
  .mini-bar span { display: block; height: 100%; background: var(--accent); }
  .c-found { --x: 1; } .bar-fill.c-found { background: var(--ok); }
  .bar-fill.c-stated_by_organiser { background: #b07a12; }
  .bar-fill.c-inferred { background: #c08d2c; }
  .bar-fill.c-not_found { background: #8a92a0; }
  .bar-fill.c-conf-H { background: var(--ok); } .bar-fill.c-conf-M { background: #b07a12; } .bar-fill.c-conf-L { background: #8a92a0; }
  .bar-fill.c-src-opened, .bar-fill.c-src-rendered { background: var(--ok); }
  .bar-fill.c-src-blocked { background: var(--bad); } .bar-fill.c-src-not_opened { background: #8a92a0; }

  /* badges and red bull markers */
  .badge { display: inline-block; font-size: 0.78rem; padding: 1px 7px; border-radius: 10px; white-space: nowrap;
           border: 1px solid transparent; vertical-align: middle; }
  .b-found { background: var(--ok-bg); color: var(--ok); }
  .b-stated { background: var(--warn-bg); color: var(--warn); }
  .b-nf { background: var(--nf-bg); color: var(--nf); }
  .b-bad { background: var(--bad-bg); color: var(--bad); }
  .b-H { background: var(--ok-bg); color: var(--ok); }
  .b-M { background: var(--warn-bg); color: var(--warn); }
  .b-L { background: var(--nf-bg); color: var(--nf); }
  .rb { display: inline-block; font-size: 0.78rem; padding: 0 5px; border-radius: 3px; white-space: nowrap; }
  .rb-found { color: var(--ok); font-weight: 700; }
  .rb-stated { color: var(--warn); font-weight: 600; }
  .rb-nf { color: var(--nf); }
  .evstrip { margin: 4px 0 8px; }
  .evlabel { color: var(--muted); font-size: 0.85rem; }

  /* tables */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .tab { text-decoration: none; color: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 2px 10px; font-size: 0.88rem; background: var(--panel); }
  .tab.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
  .tab.on .muted { color: var(--panel); }
  .tbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; }
  .tbar input[type="search"] { min-width: 260px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--fg); }
  .colmenu { position: relative; }
  .colmenu summary { cursor: pointer; border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; background: var(--panel); }
  .colbox { position: absolute; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
            padding: 8px; max-height: 360px; overflow: auto; width: 260px; }
  .colpick { display: block; font-family: Consolas, monospace; font-size: 0.85rem; padding: 1px 0; }
  button, .btn { font: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; background: var(--panel); color: var(--fg); }
  button:hover { border-color: var(--accent); }
  .tscroll { height: calc(100vh - 290px); min-height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  table.data { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 0.86rem; }
  table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 0 8px; text-align: left; vertical-align: middle; }
  table.data td { height: 34px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.data thead th { position: sticky; top: 0; background: var(--panel); z-index: 2; cursor: pointer; padding-top: 6px; white-space: nowrap; font-family: Consolas, monospace; font-size: 0.8rem; }
  table.data thead tr.frow th { top: 33px; cursor: default; padding: 3px 4px 5px; }
  table.data thead th.sorted { color: var(--accent); }
  table.data thead input { width: 100%; min-width: 80px; font: inherit; font-size: 0.8rem; padding: 2px 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); color: var(--fg); }
  table.data tbody tr[data-i] { cursor: pointer; }
  table.data tbody tr[data-i]:hover td { background: var(--bg); }
  table.data tr.spacer td { height: auto; padding: 0; border: 0; }
  table.data.small td, table.data.small th { height: auto; white-space: normal; max-width: 420px; padding: 4px 6px; }
  .copybox { width: 100%; font-family: Consolas, monospace; font-size: 0.8rem; background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
  .hscroll { overflow-x: auto; max-width: 100%; margin: 6px 0; }
  .plain { padding-left: 18px; margin: 4px 0; }
  .plain li { margin: 2px 0; }

  /* grid */
  .ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 8px 0; }
  .ctrl select, .ctrl input[type="search"], .ctrl input[type="number"] { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--fg); }
  .ctrl input[type="number"] { width: 84px; }
  .chk { font-size: 0.9rem; }
  .kinds { gap: 4px 12px; }
  .legend { font-size: 0.85rem; color: var(--muted); margin: 6px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .gridwrap { overflow: auto; max-height: calc(100vh - 230px); border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  table.grid { border-collapse: separate; border-spacing: 0; font-size: 0.82rem; }
  table.grid th, table.grid td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 3px 4px; vertical-align: top; }
  table.grid thead th { position: sticky; top: 0; background: var(--panel); z-index: 2; min-width: 120px; text-align: left; font-weight: 600; }
  table.grid th.sticky { position: sticky; left: 0; background: var(--panel); z-index: 1; min-width: 180px; text-align: left; font-weight: 600; }
  table.grid tr.grp td { background: var(--bg); font-weight: 700; text-transform: capitalize; }
  table.grid tr.grp2 td { background: var(--bg); color: var(--muted); font-style: italic; }
  .cell { width: 100%; text-align: left; padding: 3px 4px; border: 0; background: transparent; font-size: 0.8rem; }
  .cell:hover { background: var(--bg); outline: 1px solid var(--accent); }
  .cell.empty .counts { color: var(--muted); }
  .counts { font-variant-numeric: tabular-nums; }
  .band { display: flex; height: 6px; margin: 3px 0; border-radius: 3px; overflow: hidden; background: var(--nf-bg); }
  .band > span { display: block; }
  .bd-f { background: var(--ok); } .bd-i { background: #c08d2c; } .bd-n { background: #8a92a0; }

  /* maps */
  .mapctrl { display: flex; gap: 6px; margin: 4px 0; }
  .mapwrap { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--sea); }
  svg.map, svg.concept { display: block; width: 100%; height: auto; max-height: calc(100vh - 230px); min-height: 360px; touch-action: none; cursor: grab; user-select: none; }
  svg.concept { min-height: 480px; }
  svg .sea { fill: var(--sea); }
  svg .land { fill: var(--land); stroke: var(--line); stroke-width: 0.4; }
  svg .pl circle { fill: var(--accent); fill-opacity: 0.55; stroke: var(--accent); stroke-width: 1; cursor: pointer; }
  svg .pl.zero circle { fill: none; stroke-dasharray: 2 2; }
  svg .pl:hover circle { fill-opacity: 0.95; }
  svg line.edge { stroke: var(--muted); stroke-width: 1.1; stroke-opacity: 0.7; }
  svg line.e-solid { stroke-dasharray: none; }
  svg line.e-dash { stroke-dasharray: 6 4; }
  svg line.e-dot { stroke-dasharray: 1.5 3; stroke-opacity: 0.6; }
  svg .node circle { stroke: var(--panel); stroke-width: 1.5; cursor: pointer; }
  svg .node.k-disc circle { fill: #b0457a; }
  svg .node.k-place circle { fill: var(--accent); }
  svg .node.k-org circle { fill: #2d8a6e; }
  svg .node.k-series circle { fill: #8a5bc4; }
  svg .node.k-signal circle { fill: #8a92a0; }
  svg .node.k-athlete circle { fill: #c08d2c; }
  svg .node.k-rb circle { fill: #d22e3a; }
  svg .node.k-src circle { fill: none; stroke: var(--muted); }
  svg .node.sel circle { stroke: var(--fg); stroke-width: 2.5; }
  svg text { fill: var(--fg); font-size: 11px; pointer-events: none; paint-order: stroke; stroke: var(--sea); stroke-width: 3px; }
  svg .dim { opacity: 0.12; }
  svg text.dim { opacity: 0.2; }
  .legend-line { display: inline-block; width: 26px; height: 0; border-top: 2px solid var(--muted); vertical-align: middle; margin: 0 4px 0 8px; }
  .legend-line.e-dash { border-top-style: dashed; }
  .legend-line.e-dot { border-top-style: dotted; }

  /* side panel */
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel);
           border-left: 1px solid var(--line); box-shadow: -6px 0 18px rgba(0, 0, 0, 0.12); z-index: 20; display: flex; flex-direction: column; }
  .panel[hidden] { display: none; }
  .pclose { align-self: flex-end; margin: 10px 12px 0 0; }
  .pbody { padding: 4px 18px 30px; overflow: auto; }
  .panel-title { font-size: 1.1rem; margin: 6px 0 8px; word-break: break-word; }
  dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 4px 0; }
  dl.kv dt { font-family: Consolas, monospace; font-size: 0.82rem; color: var(--muted); padding-top: 2px; }
  dl.kv dd { margin: 0; word-break: break-word; }
  .rel h4 { margin-bottom: 2px; }
  .empty { color: var(--muted); }

  /* small screens: menu on top, panel full width */
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .menu { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px; }
    .menu a { padding: 5px 8px; font-size: 0.9rem; }
    .main { padding: 12px 16px 40px; }
    .bar-row { grid-template-columns: 110px 1fr 46px; }
    .tbar input[type="search"] { min-width: 0; width: 100%; }
    .tscroll { height: calc(100vh - 330px); }
  }
</style>
</head>

<script>
/* Dance Scene Atlas viewer: core (data indexes, badges, tables, side panel, navigation).

(function () {
  "use strict";

  var DATA = window.ATLAS_DATA;
  var COLS = DATA.columns;
  var BUILD = DATA.build;

  // Tables are stored as column-ordered arrays; expand them once into row objects.
  var T = {};
  Object.keys(COLS).forEach(function (name) {
    var src = DATA.tables[name];

    T[name] = src.v.map(function (values, i) {

      cols.forEach(function (c, j) { row[c] = values[j]; });
      return row;
    });
  });

  var FILE_LABEL = {
    "places.csv": "Places",
    "disciplines.csv": "Disciplines",
    "signals.csv": "Signals",
    "sources.csv": "Sources",
    "facts.csv": "Facts",
    "events.csv": "Events",
    "organisations.csv": "Organisations",
    "athletes.csv": "Athletes",
    "redbull_finance.csv": "Red Bull finance",
    "relations.csv": "Relations",
    "review_log.csv": "Review log"
  };
  var TABLE_NAMES = Object.keys(FILE_LABEL);

  // Columns that hold an id of a row in another table, and the kind of that table.
  var REF_KIND = {
    place_id: "place", base_place_id: "place", disc_id: "disc", signal_id: "signal",
    source_id: "source", website_source_id: "source", organiser_org_id: "org",
    org_id: "org", event_id: "event", athlete_id: "athlete"
  };
  var KIND_TABLE = {
    place: "places.csv", disc: "disciplines.csv", signal: "signals.csv", source: "sources.csv",
    org: "organisations.csv", event: "events.csv", athlete: "athletes.csv"
  };
  var KIND_KEY = {
    place: "place_id", disc: "disc_id", signal: "signal_id", source: "source_id",
    org: "org_id", event: "event_id", athlete: "athlete_id"
  };
  var KIND_NAME = {
    place: "name", disc: "discipline", signal: "signal", source: "title",
    org: "name", event: "name", athlete: "public_name"
  };
  var TYPE_KIND = {
    place: "place", discipline: "disc", org: "org", event: "event", athlete: "athlete"
  };
  // Columns that refer to the same kind of thing under another name.
  var SAME_COLS = {
    place_id: ["base_place_id"], base_place_id: ["place_id"],
    org_id: ["organiser_org_id"], organiser_org_id: ["org_id"],
    source_id: ["website_source_id"], website_source_id: ["source_id"]
  };
  var BADGE = {
    found: ["found", "b-found"],
    stated_by_organiser: ["stated by organiser", "b-stated"],
    inferred: ["inferred", "b-stated"],
    not_found: ["not found", "b-nf"],
    H: ["confidence H (high)", "b-H"],
    M: ["confidence M (medium)", "b-M"],
    L: ["confidence L (low)", "b-L"],
    opened: ["opened", "b-found"],
    rendered: ["rendered", "b-found"],
    blocked: ["blocked", "b-bad"],
    not_opened: ["never opened", "b-nf"],
    not_checked: ["not checked", "b-nf"],
    confirmed_absent: ["confirmed absent", "b-nf"]
  };
  // Columns shown as badges, with a words prefix.
  var BADGE_COLS = {
    evidence_type: "", confidence: "", access_status: "", scale_evidence: "scale: ",
    red_bull_involvement: "Red Bull: ", red_bull_athlete: "Red Bull athlete: "
  };
  var ROW_H = 34;

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }

  function indexBy(rows, key) {
    var map = {};
    rows.forEach(function (r) {
      if (r[key] && map[r[key]] === undefined) map[r[key]] = r;
    });
    return map;
  }

  function groupBy(rows, key) {
    var map = {};
    rows.forEach(function (r) {
      var k = r[key];
      if (!k) return;
      (map[k] || (map[k] = [])).push(r);
    });
    return map;
  }

  var IDX = {};
  Object.keys(KIND_TABLE).forEach(function (kind) {
    IDX[kind] = indexBy(T[KIND_TABLE[kind]], KIND_KEY[kind]);
  });

  // Kind of the table that a column refers to in this row (relations use from_type/to_type).
  function kindOf(name, col, row) {
    if (name === "relations.csv" && (col === "from_id" || col === "to_id")) {
      return TYPE_KIND[row[col === "from_id" ? "from_type" : "to_type"]] || null;
    }
    return REF_KIND[col] || null;
  }

  function labelFor(name, col, row) {
    var value = row[col];
    if (!value) return "";
    var kind = kindOf(name, col, row);
    if (!kind) return "";
    var ref = IDX[kind][value];
    return ref ? String(ref[KIND_NAME[kind]]) : "";
  }

  function badge(col, value) {
    var b = BADGE[value];
    if (!b) return esc(value);
    var prefix = BADGE_COLS[col] || "";
    return '<span class="badge ' + b[1] + '">' + esc(prefix + b[0]) + "</span>";
  }

  function sourceCell(id) {
    if (!id) return "";
    var s = IDX.source[id];
    if (!s) return esc(id) + ' <span class="badge b-bad">missing source row</span>';
    return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer" title="' +
      esc(s.url) + '">' + esc(s.title) + "</a> " + badge("access_status", s.access_status);
  }

  function cellHtml(name, col, row) {
    var value = row[col];
    if (value === "" || value == null) return "";
    if (col === "source_id" || col === "website_source_id") return sourceCell(value);
    if (col === "url") return '<a href="' + esc(value) + '" target="_blank" rel="noopener noreferrer">' + esc(value) + "</a>";
    if (BADGE_COLS.hasOwnProperty(col)) return badge(col, value);
    var label = labelFor(name, col, row);
    if (label) return esc(label) + ' <span class="code">' + esc(value) + "</span>";
    return esc(value);
  }

  // Plain text of a cell, used by the search and the filters (includes names behind ids).
  function cellText(name, col, row) {
    var value = row[col] == null ? "" : String(row[col]);
    var extra = labelFor(name, col, row);
    var word = BADGE[value] ? BADGE[value][0] : "";
    return value + " " + extra + " " + word;
  }

  function rowTitle(name, row) {
    if (name === "facts.csv") {
      return row.fact_id + " · " + (IDX.signal[row.signal_id] ? IDX.signal[row.signal_id].signal : row.signal_id) +
        " · " + (row.value || (row.value_low ? row.value_low + "–" + row.value_high : "not found"));
    }
    var first = COLS[name][0];
    var label = row.name || row.title || row.public_name || row.entity || row.metric ||
      row.item || row.relation || "";
    return row[first] + (label ? " · " + label : "");
  }

  /* ---------- side panel ---------- */
  var REG = [];
  var panel, panelBody;

  function openPanel(title, html) {
    panelBody.innerHTML = '<h2 class="panel-title">' + esc(title) + "</h2>" + html;
    panel.hidden = false;
    panelBody.scrollTop = 0;
  }

  function closePanel() {
    panel.hidden = true;
  }

  function registerRow(name, row) {
    REG.push({ table: name, row: row });
    return REG.length - 1;
  }

  function sourceBlock(row) {
    var id = row.source_id || row.website_source_id;
    if (!id) {
      return '<p class="note">No source on this row. It is a <b>not found</b> record or has no source yet; see the notes.</p>';
    }
    var s = IDX.source[id];
    if (!s) return '<p class="note">Source ' + esc(id) + " is missing from sources.csv.</p>";
    var used = 0;
    T["facts.csv"].concat(T["events.csv"], T["organisations.csv"], T["athletes.csv"],
      T["redbull_finance.csv"], T["relations.csv"]).forEach(function (r) {
      if (r.source_id === id || r.website_source_id === id) used++;
    });
    return '<dl class="kv">' +
      "<dt>Title</dt><dd>" + esc(s.title) + "</dd>" +
      "<dt>Publisher</dt><dd>" + esc(s.publisher) + "</dd>" +
      "<dt>Source type</dt><dd>" + esc(s.source_type) + "</dd>" +
      "<dt>Link</dt><dd>" + (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.url) + "</a>" : "none") + "</dd>" +
      "<dt>Access</dt><dd>" + badge("access_status", s.access_status) + (s.access_date ? " on " + esc(s.access_date) : "") + "</dd>" +
      "<dt>Notes</dt><dd>" + esc(s.notes) + "</dd>" +
      "<dt>Rows that use it</dt><dd>" + used + ' · <a href="#" data-go="sources" data-src="' + esc(id) + '">open in Sources</a></dd>' +
      "</dl>";
  }

  var HUMAN_COL = {
    place_id: "place", base_place_id: "place", disc_id: "discipline", signal_id: "signal",
    source_id: "source", website_source_id: "source", org_id: "organisation",
    organiser_org_id: "organisation", event_id: "event", athlete_id: "athlete", series: "series"
  };

  function relatedHtml(name, row) {
    var checks = [];
    COLS[name].forEach(function (col) {
      var value = row[col];
      if (!value) return;
      if (name === "relations.csv" && (col === "from_id" || col === "to_id")) return;
      if (col === "series") {
        checks.push({ col: col, value: value, cands: ["series"] });
      } else if (REF_KIND[col]) {
        checks.push({ col: col, value: value, cands: [col].concat(SAME_COLS[col] || []) });
      }
    });
    var html = "";
    checks.forEach(function (c) {
      TABLE_NAMES.forEach(function (tn) {
        var hits = T[tn].filter(function (r) {
          if (r === row) return false;
          return c.cands.some(function (k) { return COLS[tn].indexOf(k) >= 0 && r[k] === c.value; });
        });
        if (!hits.length) return;
        var shown = hits.slice(0, 25);
        var what = HUMAN_COL[c.col] || c.col;
        var label = labelFor(name, c.col, row) || c.value;
        html += '<div class="rel"><h4>' + esc(FILE_LABEL[tn]) + " with the same " + esc(what) +
          ": " + esc(label) + " (" + hits.length + ")</h4><ul>";
        shown.forEach(function (r) {
          html += '<li><a href="#" data-reg="' + registerRow(tn, r) + '">' + esc(rowTitle(tn, r)) + "</a></li>";
        });
        html += "</ul>";
        if (hits.length > shown.length) {
          html += '<p class="note">Showing 25 of ' + hits.length + '. <a href="#" data-filter-table="' + esc(tn) +
            '" data-col="' + esc(c.cands[0]) + '" data-val="' + esc(c.value) + '">Show all in the table</a></p>';
        } else {
          html += '<p class="note"><a href="#" data-filter-table="' + esc(tn) + '" data-col="' + esc(c.cands[0]) +
            '" data-val="' + esc(c.value) + '">Open in the table</a></p>';
        }
        html += "</div>";
      });
    });
    return html || '<p class="note">No other rows share an id with this row.</p>';
  }

  function openRow(name, row) {
    REG = [];
    var evidence = [];
    ["evidence_type", "confidence", "red_bull_involvement", "red_bull_athlete", "scale_evidence", "access_status"]
      .forEach(function (col) {
        if (row[col] !== undefined && row[col] !== "") {
          evidence.push('<span class="evlabel">' + esc(col.replace(/_/g, " ")) + ":</span> " + badge(col, row[col]));
        }
      });
    var columns = COLS[name].map(function (col) {
      return "<dt>" + esc(col) + "</dt><dd>" + (cellHtml(name, col, row) || '<span class="muted">empty</span>') + "</dd>";
    }).join("");
    var html =
      '<p class="muted">' + esc(FILE_LABEL[name]) + " · " + esc(name) + " · row " + row._row + " in the file</p>" +
      (evidence.length ? '<div class="evstrip">' + evidence.join(" &nbsp; ") + "</div>" : "") +
      "<h3>Source</h3>" + sourceBlock(row) +
      "<h3>All columns</h3><dl class=\"kv\">" + columns + "</dl>" +
      "<h3>Related rows</h3>" + relatedHtml(name, row);
    openPanel(rowTitle(name, row), html);
  }

  /* ---------- tables ---------- */
  var TS = {};

  function tstate(name) {
    return TS[name] || (TS[name] = { q: "", f: {}, sort: null, dir: 1, hidden: {}, view: [] });
  }

  function visibleCols(name) {
    var st = tstate(name);
    return COLS[name].filter(function (c) { return !st.hidden[c]; });
  }

  function isNumeric(v) {
    return v !== "" && !isNaN(Number(v));
  }

  function tableView(name) {
    var st = tstate(name);
    var q = st.q.toLowerCase();
    var filters = Object.keys(st.f).filter(function (c) { return st.f[c]; });
    var out = T[name].filter(function (row) {
      if (q) {
        var hit = COLS[name].some(function (c) {
          return cellText(name, c, row).toLowerCase().indexOf(q) >= 0;
        });
        if (!hit) return false;
      }
      return filters.every(function (c) {
        return cellText(name, c, row).toLowerCase().indexOf(st.f[c].toLowerCase()) >= 0;
      });
    });
    if (st.sort) {
      var col = st.sort;
      var dir = st.dir;
      out.sort(function (a, b) {
        var x = a[col] || "";
        var y = b[col] || "";
        if (isNumeric(x) && isNumeric(y)) return (Number(x) - Number(y)) * dir;
        return x.localeCompare(y) * dir;
      });
    }
    return out;
  }

  function theadHtml(name) {
    var st = tstate(name);
    var cols = visibleCols(name);
    var top = cols.map(function (c) {
      var mark = st.sort === c ? (st.dir > 0 ? " ▲" : " ▼") : "";
      return '<th data-sort="' + esc(c) + '"' + (st.sort === c ? ' class="sorted"' : "") + ">" + esc(c) + mark + "</th>";
    }).join("");
    var filters = cols.map(function (c) {
      return '<th><input data-f="' + esc(c) + '" value="' + esc(st.f[c] || "") + '" placeholder="filter" aria-label="filter ' + esc(c) + '"></th>';

  function renderBody(name) {

    var cols = visibleCols(name);
    var view = st.view;
    var start = Math.max(0, Math.floor(scroller.scrollTop / ROW_H) - 15);
    var count = Math.ceil((scroller.clientHeight || 600) / ROW_H) + 30;
    var end = Math.min(view.length, start + count);
    var span = cols.length || 1;
    var html = '<tr class="spacer" style="height:' + (start * ROW_H) + 'px"><td colspan="' + span + '"></td></tr>';
    for (var i = start; i < end; i++) {
      var row = view[i];
      html += '<tr data-i="' + i + '">';
      cols.forEach(function (c) {
        html += "<td>" + cellHtml(name, c, row) + "</td>";
      });
      html += "</tr>";
    }
    html += '<tr class="spacer" style="height:' + ((view.length - end) * ROW_H) + 'px"><td colspan="' + span + '"></td></tr>';

  function refreshView(name, resetScroll) {

  function csvText(name, rows, cols) {

    }
    return [cols.map(q).join(",")].concat(rows.map(function (r) {
      return cols.map(function (c) { return q(r[c]); }).join(",");
    })).join("\r\n");
  }

  function copyCsv(name) {
    var st = tstate(name);
    var cols = visibleCols(name);
    var text = csvText(name, st.view, cols);
    function fallback() {
      openPanel("Copy this text (CSV)", '<p class="note">Copying is not allowed here. Select the text below and copy it (Ctrl+C).</p>' +
        '<textarea class="copybox" readonly rows="18">' + esc(text) + "</textarea>");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        document.getElementById("tcopied").textContent = "Copied " + st.view.length + " rows as CSV.";
      }, fallback);

      fallback();

  function viewTables(el, parts) {
    var name = decodeURIComponent(parts[0] || "");

    var st = tstate(name);
    var tabs = TABLE_NAMES.map(function (tn) {
      return '<a href="#/tables/' + encodeURIComponent(tn) + '" class="tab' + (tn === name ? " on" : "") + '">' +
        esc(FILE_LABEL[tn]) + " <span class=\"muted\">" + T[tn].length + "</span></a>";
    }).join("");

      return '<label class="colpick"><input type="checkbox" data-col-toggle="' + esc(c) + '"' +
        (st.hidden[c] ? "" : " checked") + "> " + esc(c) + "</label>";
    }).join("");
    el.innerHTML =
      "<h1>Tables</h1>" +
      '<p class="muted">One tab per CSV file (<code>data/' + esc(name) + "</code>). Click a row to see its source and related rows. Every source link is clickable. Column names are the data schema names.</p>" +
      '<nav class="tabs" aria-label="Tables">' + tabs + "</nav>" +
      '<div class="tbar">' +
      '<input id="tq" type="search" placeholder="Search all columns" value="' + esc(st.q) + '" aria-label="Search all columns">' +
      '<span id="tcount" class="muted"></span>' +
      '<details class="colmenu"><summary>Show or hide columns</summary><div class="colbox">' + cols + "</div></details>" +
      '<button id="tcopy" type="button">Copy as CSV</button>' +
      '<span id="tcopied" class="muted" aria-live="polite"></span>' +
      "</div>" +
      '<div id="tscroll" class="tscroll"><table class="data"><thead id="thead">' + theadHtml(name) +
      '</thead><tbody id="tbody"></tbody></table></div>';

    refreshView(name, false);

    var scroller = document.getElementById("tscroll");
    scroller.onscroll = function () { renderBody(name); };
    document.getElementById("tq").oninput = function (e) {
      st.q = e.target.value;
      refreshView(name, true);
    };
    document.getElementById("tcopy").onclick = function () { copyCsv(name); };
    el.onclick = function (e) {
      var th = e.target.closest ? e.target.closest("th[data-sort]") : null;
      if (th) {
        var col = th.getAttribute("data-sort");
        if (st.sort === col) { st.dir = -st.dir; } else { st.sort = col; st.dir = 1; }
        document.getElementById("thead").innerHTML = theadHtml(name);
        refreshView(name, false);
        return;
      }
      var tr = e.target.closest ? e.target.closest("tbody tr[data-i]") : null;
      if (tr) openRow(name, st.view[Number(tr.getAttribute("data-i"))]);

    el.oninput = function (e) {
      var f = e.target.getAttribute && e.target.getAttribute("data-f");
      if (!f) return;
      st.f[f] = e.target.value;
      refreshView(name, true);
    };
    el.onchange = function (e) {
      var c = e.target.getAttribute && e.target.getAttribute("data-col-toggle");
      if (!c) return;
      st.hidden[c] = !e.target.checked;
      document.getElementById("thead").innerHTML = theadHtml(name);
      refreshView(name, false);
    };
  }

  // Opens a table with a filter on one column (used by links from numbers and related rows).
  function openTableFilter(name, col, value) {
    var st = tstate(name);
    st.q = "";
    st.f = {};

    go("#/tables/" + encodeURIComponent(name));
  }

  /* ---------- navigation ---------- */
  var VIEWS = {};
  var NAV = [
    ["overview", "Overview"], ["compare", "City comparison"], ["market", "Breaking vs Latin"],
    ["tables", "Tables"], ["grid", "Grid"], ["map", "Geographic map"],
    ["concept", "Concept map"], ["sources", "Sources"], ["about", "About"]

  }

  function buildShell() {

      '<main id="view" class="main"></main></div>' +
      '<aside id="panel" class="panel" hidden><button id="pclose" class="pclose" type="button" aria-label="Close">Close ×</button>' +
      '<div id="pbody" class="pbody"></div></aside>';
    panel = document.getElementById("panel");
    panelBody = document.getElementById("pbody");
    document.getElementById("pclose").onclick = closePanel;
    panelBody.onclick = function (e) {
      var a = e.target.closest ? e.target.closest("a") : null;
      if (!a) return;
      var reg = a.getAttribute("data-reg");
      var ft = a.getAttribute("data-filter-table");
      var go2 = a.getAttribute("data-go");
      if (reg !== null) {
        e.preventDefault();
        openRow(REG[Number(reg)].table, REG[Number(reg)].row);
      } else if (ft) {
        e.preventDefault();
        openTableFilter(ft, a.getAttribute("data-col"), a.getAttribute("data-val"));
      } else if (go2) {
        e.preventDefault();
        if (go2 === "sources") {
          var st = tstate("sources.csv");
          st.q = a.getAttribute("data-src") || "";
          st.f = {};
          go("#/tables/sources.csv");
          closePanel();
        }

  }

  window.ATLAS = {
    T: T, COLS: COLS, IDX: IDX, BUILD: BUILD, FILE_LABEL: FILE_LABEL, TABLE_NAMES: TABLE_NAMES,
    esc: esc, badge: badge, sourceCell: sourceCell, labelFor: labelFor, cellHtml: cellHtml,
    openRow: openRow, openPanel: openPanel, closePanel: closePanel, registerRow: registerRow,
    openTableFilter: openTableFilter, go: go, registerView: registerView, groupBy: groupBy,
    indexBy: indexBy, rowTitle: rowTitle, registerViewFn: registerView
  };

  registerView("tables", viewTables);
  buildShell();
  // views.js registers the other views and then calls start().
  window.ATLAS_START = function () {
    window.addEventListener("hashchange", route);
    route();
  };
})();

/* Dance Scene Atlas viewer: analysis views (city comparison, breaking vs Latin).
   Reads the same tables as the other views. Shows raw values side by side; the only derived

(function () {
  "use strict";

  var A = window.ATLAS;
  var T = A.T;
  var esc = A.esc;
  var badge = A.badge;
  var FACTS = T["facts.csv"];
  var EVENTS = T["events.csv"];
  var PLACES = T["places.csv"];
  var DISCS = T["disciplines.csv"];
  var SIGNALS = T["signals.csv"];

  var MAIN = ["URB-BRK", "CAR-SAL", "CAR-BCH"];
  var MAIN_LABEL = { "URB-BRK": "Breaking", "CAR-SAL": "Salsa", "CAR-BCH": "Bachata" };
  var SCENE_SIGNALS = ["EVT", "SCH", "COM", "CMP", "ATH", "SPA", "PRC", "LAD", "ORG"];
  var CONF_RANK = { H: 0, M: 1, L: 2 };
  var EV_RANK = { found: 0, stated_by_organiser: 1, inferred: 2, not_found: 3 };

  function isFlagged(f) { return /^REVIEW /.test(f.notes || ""); }
  function isReal(f) { return f.evidence_type !== "not_found"; }
  function num(v) { var n = parseFloat(v); return isNaN(n) ? null : n; }
  function fmt(n) { return n === null || n === undefined ? "" : Number(n).toLocaleString("en-GB"); }
  function valueText(f) {
    if (f.value !== "") return f.value;
    if (f.value_low !== "" || f.value_high !== "") return f.value_low + "–" + f.value_high;
    return "";
  }
  function better(a, b) {
    var ea = EV_RANK[a.evidence_type], eb = EV_RANK[b.evidence_type];
    if (ea !== eb) return ea - eb;
    return (CONF_RANK[a.confidence] || 3) - (CONF_RANK[b.confidence] || 3);
  }
  function placeById(id) { return A.IDX.place[id]; }
  function confBadge(c) { return '<span class="badge b-' + esc(c) + '" title="confidence ' + esc(c) + '">' + esc(c) + "</span>"; }
  // Area a population figure refers to, read from its unit and notes.
  function areaOf(f) {
    var s = (f.unit || "") + " " + (f.notes || "");
    if (/FUA/.test(s)) return "metro (FUA)";
    if (/greater city/i.test(s)) return "greater city";

  // Clickable rows: each view keeps its own list and opens the side panel on click.
  function linker() {

        return '<a href="#" data-arow="' + (rows.length - 1) + '"' + (title ? ' title="' + esc(title) + '"' : "") + ">" + html + "</a>";
      },
      handler: function (e) {
        var a = e.target.closest ? e.target.closest("a[data-arow]") : null;
        if (!a) return false;

      }
    };
  }

  function contextFact(placeId, signal) {
    var fs = FACTS.filter(function (f) {
      return f.place_id === placeId && f.disc_id === "ALL" && f.signal_id === signal && isReal(f);
    });
    function areaRank(f) { return signal === "POP" && areaOf(f) !== "city" ? 1 : 0; }
    fs.sort(function (a, b) { return areaRank(a) - areaRank(b) || better(a, b) || String(b.period).localeCompare(String(a.period)); });
    return fs[0] || null;
  }

  function redBullEvents(placeId) {
    return EVENTS.filter(function (e) {

  /* ---------- city comparison ---------- */

  function viewCompare(el) {

    var cities = PLACES.filter(function (p) { return p.role === "deep"; });

    function cell(place, disc, signal) {
      var fs = FACTS.filter(function (f) {

      var level = "city";
      if (!fs.some(isReal)) {

        });
        if (cfs.length) { fs = cfs; level = "country"; }
      }
      if (cmpState.hideFlagged) fs = fs.filter(function (f) { return !isFlagged(f); });
      if (cmpState.unit) fs = fs.filter(function (f) { return !isReal(f) || f.unit === cmpState.unit; });
      var real = fs.filter(isReal).sort(better);
      if (!real.length) {
        var nf = fs.filter(function (f) { return f.evidence_type === "not_found"; });
        if (nf.length) return { html: L.link("facts.csv", nf[0], '<span class="muted">not found</span>', nf[0].notes), unit: null };
        return { html: '<span class="muted">—</span>', unit: null };
      }
      var f = real[0];
      var flag = isFlagged(f) ? ' <span class="badge b-bad" title="Flagged for review">!</span>' : "";
      var more = real.length > 1 ? ' <span class="muted small">+' + (real.length - 1) + "</span>" : "";
      var where = level === "country" ? ' <span class="muted small">(' + esc(place.country_iso2) + ")</span>" : "";
      var html = L.link("facts.csv", f, "<b>" + esc(valueText(f)) + "</b>", f.notes) +
        ' <span class="small muted">' + esc(f.unit) + "</span>" + where + flag + more +
        " " + confBadge(f.confidence);
      return { html: html, unit: f.unit, level: level };
    }

    function unitsFor(sig) {
      var u = {};

        var p = placeById(f.place_id);

        u[f.unit] = (u[f.unit] || 0) + 1;

      return Object.keys(u).sort(function (a, b) { return u[b] - u[a] || a.localeCompare(b); }).map(function (k) { return [k, u[k]]; });

      var rows = cities.map(function (p) {

            ' <span class="small muted">' + esc(areaOf(r.pop)) + "</span>" : '<span class="muted">—</span>') + "</td>" +
          "<td>" + (r.stu ? L.link("facts.csv", r.stu, fmt(num(r.stu.value)), r.stu.period + " · " + r.stu.notes) : '<span class="muted">—</span>') + "</td>" +
          '<td class="small">' + rbHtml + "</td>" + tds + "</tr>";
      }).join("");

      var sigInfo = A.IDX.signal[sig];
      var unitNotes = MAIN.map(function (d) {
        var list = Object.keys(units[d]);
        var verdict = list.length > 1
          ? '<span class="badge b-bad">not comparable as is: ' + list.length + " different units</span>"
          : (list.length === 1 ? '<span class="badge b-found">one unit</span>' : '<span class="badge b-nf">no values</span>');
        return "<li><b>" + MAIN_LABEL[d] + "</b>: values for " + withValue[d] + " of " + cities.length + " cities · " + verdict +
          (list.length ? '<br><span class="small muted">' + list.map(function (u) { return esc(u) + " (" + units[d][u] + ")"; }).join(" · ") + "</span>" : "") + "</li>";
      }).join("");

      el.innerHTML =
        "<h1>City comparison</h1>" +
        '<p class="muted">The 15 deep cities side by side: size, Red Bull dance events 2024-2026, and one scene signal for breaking, salsa and bachata. ' +
        'Each cell shows the best row on file (found before inferred, H before L); "+n" means more rows exist. Click a value for its row and source. ' +
        'A red <span class="badge b-bad">!</span> marks a row flagged for review (2026-10-20). Values marked with a country code are national, not city values. ' +
        'Pick one unit to see only values measured the same way.</p>' +
        '<div class="ctrl"><label>Signal <select id="csig">' + SCENE_SIGNALS.map(function (s) {
          var info = A.IDX.signal[s];
          return '<option value="' + s + '"' + (s === sig ? " selected" : "") + ">" + s + (info ? " · " + esc(info.signal) : "") + "</option>";
        }).join("") + "</select></label>" +
        '<label>Order <select id="cord"><option value="pop"' + (cmpState.order === "pop" ? " selected" : "") + '>by population</option><option value="name"' + (cmpState.order === "name" ? " selected" : "") + ">by name</option></select></label>" +
        '<label>Unit <select id="cunit"><option value="">all units</option>' + unitList.map(function (x) {
          return '<option value="' + esc(x[0]) + '"' + (x[0] === cmpState.unit ? " selected" : "") + ">" + esc(x[0]) + " (" + x[1] + ")</option>";
        }).join("") + "</select></label>" +

        (sigInfo && sigInfo.definition ? '<p class="note"><b>' + esc(sig) + "</b>: " + esc(sigInfo.definition) + "</p>" : "") +
        '<div class="hscroll"><table class="data small"><thead><tr><th>City</th><th>Population</th><th>Students</th><th>Red Bull dance events 2024-2026</th>' +
        MAIN.map(function (d) { return "<th>" + MAIN_LABEL[d] + " · " + esc(sig) + "</th>"; }).join("") +

    }

  }

  /* ---------- breaking vs Latin ---------- */
  function wikiRows() {
    // One value per language and discipline: prefer rows whose unit names the article.
    var out = {};
    FACTS.forEach(function (f) {
      if (f.place_id !== "GLOBAL" || f.signal_id !== "ONL" || !isReal(f) || MAIN.indexOf(f.disc_id) < 0) return;
      var m = /\((?:[^,]*), (\w\w)\.wiki article "([^"]+)"\)/.exec(f.unit);
      var lang = m ? m[1] : null;
      var strong = !!m;
      if (!lang) {
        var m2 = /(\w\w)\.wikipedia/.exec(f.notes || "");
        if (m2) lang = m2[1];
      }
      if (!lang) return;
      var key = lang + "|" + f.disc_id;
      if (!out[key] || (strong && !out[key].strong)) out[key] = { f: f, strong: strong, title: m ? m[2] : "" };
    });
    return out;
  }

  function viewMarket(el) {
    var L = linker();
    var W = wikiRows();
    var langs = ["en", "de", "fr", "es", "it", "pl", "nl", "pt"];
    var LANG = { en: "English", de: "German", fr: "French", es: "Spanish", it: "Italian", pl: "Polish", nl: "Dutch", pt: "Portuguese" };

  /* ---------- pan and zoom (SVG viewBox) ---------- */
  function panZoom(svg, base) {
    var v = { x: base.x, y: base.y, w: base.w, h: base.h };
    var drag = null;
    function apply() {
      svg.setAttribute("viewBox", [v.x, v.y, v.w, v.h].map(function (n) { return n.toFixed(2); }).join(" "));
    }
    function zoomAt(f, px, py) {
      var cx = v.x + px * v.w; var cy = v.y + py * v.h;
      v.w *= f; v.h *= f;
      v.x = cx - px * v.w; v.y = cy - py * v.h;
      apply();
    }
    svg.addEventListener("wheel", function (e) {
      e.preventDefault();
      var r = svg.getBoundingClientRect();
      zoomAt(e.deltaY > 0 ? 1.15 : 1 / 1.15, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
    }, { passive: false });
    svg.addEventListener("pointerdown", function (e) {
      if (e.target.closest && e.target.closest("[data-node],[data-place]")) return;
      drag = { x: e.clientX, y: e.clientY, vx: v.x, vy: v.y };
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var r = svg.getBoundingClientRect();
      v.x = drag.vx - (e.clientX - drag.x) * v.w / r.width;
      v.y = drag.vy - (e.clientY - drag.y) * v.h / r.height;
      apply();
    });
    svg.addEventListener("pointerup", function () { drag = null; });
    apply();
    return {
      zoom: function (f) { zoomAt(f, 0.5, 0.5); },
      reset: function (b) { v = { x: b.x, y: b.y, w: b.w, h: b.h }; apply(); }
    };
  }

  /* ---------- concept map ---------- */
  var KIND_ORDER = ["disc", "place", "org", "series", "signal", "athlete", "rb", "src"];
  var KIND_LABEL = { disc: "Discipline", place: "Place", org: "Organisation", series: "Event series",
    signal: "Signal", athlete: "Athlete", rb: "Red Bull", src: "Source" };
  var EV_RANK = { found: 4, stated_by_organiser: 3, inferred: 2, not_found: 1 };
  var EV_STYLE = { found: "e-solid", stated_by_organiser: "e-dash", inferred: "e-dash", not_found: "e-dot" };

  function buildGraph(opt) {
    var nodes = {};
    var edges = {};
    function node(id, kind, label, table, row) {
      if (!nodes[id]) nodes[id] = { id: id, kind: kind, label: label || id, table: table, row: row, deg: 0 };
      return nodes[id];
    }
    function edge(a, b, ev) {
      if (!a || !b || a === b) return;
      var key = a < b ? a + "~" + b : b + "~" + a;
      var e = edges[key];
      if (!e) e = edges[key] = { a: a < b ? a : b, b: a < b ? b : a, ev: "not_found", count: 0 };
      e.count++;
      if ((EV_RANK[ev] || 0) > (EV_RANK[e.ev] || 0)) e.ev = ev;
    }
    PLACES.forEach(function (p) { node("p:" + p.place_id, "place", p.name, "places.csv", p); });
    DISCS.forEach(function (d) { if (d.disc_id !== "ALL") node("d:" + d.disc_id, "disc", d.discipline, "disciplines.csv", d); });
    ATHLETES.forEach(function (a) { node("a:" + a.athlete_id, "athlete", a.public_name, "athletes.csv", a); });
    var seriesRows = {};
    EVENTS.forEach(function (e) {
      var sid = "s:" + e.series;
      node(sid, "series", e.series, null, null);
      (seriesRows[sid] || (seriesRows[sid] = [])).push(e);
      edge(sid, "p:" + e.place_id, "found");
      if (e.organiser_org_id) edge(sid, "o:" + e.organiser_org_id, "found");
      if (e.red_bull_involvement === "found") edge(sid, "rb", "found");
      if (e.red_bull_involvement === "stated_by_organiser") edge(sid, "rb", "stated_by_organiser");
      if (opt.sources && e.source_id) edge(sid, "src:" + e.source_id, "found");
    });
    ORGS.forEach(function (o) {
      node("o:" + o.org_id, "org", o.name, "organisations.csv", o);
      edge("o:" + o.org_id, "p:" + o.place_id, o.evidence_type);
      if (o.disc_id !== "ALL") edge("o:" + o.org_id, "d:" + o.disc_id, o.evidence_type);
      if (opt.sources && o.website_source_id) edge("o:" + o.org_id, "src:" + o.website_source_id, o.evidence_type);
    });
    FACTS.forEach(function (f) {
      node("g:" + f.signal_id, "signal", (IDX.signal[f.signal_id] || {}).signal || f.signal_id, "signals.csv", IDX.signal[f.signal_id]);
      edge("p:" + f.place_id, "g:" + f.signal_id, f.evidence_type);
      if (f.disc_id !== "ALL") edge("p:" + f.place_id, "d:" + f.disc_id, f.evidence_type);
      if (opt.sources && f.source_id) edge("g:" + f.signal_id, "src:" + f.source_id, f.evidence_type);
    });
    ATHLETES.forEach(function (a) {
      if (a.base_place_id) edge("a:" + a.athlete_id, "p:" + a.base_place_id, "found");
      if (a.disc_id !== "ALL") edge("a:" + a.athlete_id, "d:" + a.disc_id, "found");
    });
    RELATIONS.forEach(function (r) {
      function ref(type, id) {
        if (type === "place") return "p:" + id;
        if (type === "discipline") return "d:" + id;
        if (type === "org") return "o:" + id;
        if (type === "athlete") return "a:" + id;
        if (type === "event") {
          var ev = IDX.event[id];
          return ev ? "s:" + ev.series : null;
        }
        if (type === "series") { node("s:" + id, "series", id, null, null); return "s:" + id; }
        return null;
      }
      edge(ref(r.from_type, r.from_id), ref(r.to_type, r.to_id), r.evidence_type);
    });
    if (opt.sources) {
      SOURCES.forEach(function (s) { node("src:" + s.source_id, "src", s.title, "sources.csv", s); });
    }
    // Attach labels to series and signal nodes that have a row.
    Object.keys(nodes).forEach(function (id) {
      if (nodes[id].kind === "signal" && !nodes[id].row) nodes[id].row = null;
    });
    if (Object.keys(edges).some(function (k) { return edges[k].a === "rb" || edges[k].b === "rb"; })) {
      node("rb", "rb", "Red Bull", null, null);
    }
    return { nodes: nodes, edges: edges, seriesRows: seriesRows };
  }

  function filterGraph(g, opt) {
    var nodes = g.nodes; var edges = g.edges;
    var allowed = function (n) { return opt.kinds[n.kind] !== false; };
    var keep = {};
    Object.keys(nodes).forEach(function (id) {
      var n = nodes[id];
      if (!allowed(n)) return;
      if (n.kind === "disc" && opt.disc !== "ALL" && n.id !== "d:" + opt.disc) return;
      if (n.kind === "place" && opt.region !== "ALL" && n.row && n.row.region !== opt.region) return;
      keep[id] = true;
    });
    var out = {};
    Object.keys(edges).forEach(function (k) {
      var e = edges[k];
      if (keep[e.a] && keep[e.b]) out[k] = e;
    });
    // Drop nodes that lost all their edges (isolated nodes add nothing to the graph).
    var deg = {};
    Object.keys(out).forEach(function (k) { deg[out[k].a] = (deg[out[k].a] || 0) + 1; deg[out[k].b] = (deg[out[k].b] || 0) + 1; });
    var final = {};
    Object.keys(keep).forEach(function (id) { if (deg[id]) final[id] = nodes[id]; });
    var finalEdges = {};
    Object.keys(out).forEach(function (k) { if (final[out[k].a] && final[out[k].b]) finalEdges[k] = out[k]; });
    Object.keys(final).forEach(function (id) { final[id].deg = 0; });
    Object.keys(finalEdges).forEach(function (k) { final[finalEdges[k].a].deg++; final[finalEdges[k].b].deg++; });
    return { nodes: final, edges: finalEdges };
  }

  function limitGraph(f, limit) {
    var ids = Object.keys(f.nodes);
    var total = ids.length;
    if (total <= limit) return { g: f, total: total, cut: false };
    ids.sort(function (a, b) { return f.nodes[b].deg - f.nodes[a].deg || (a < b ? -1 : 1); });
    var keepIds = {};
    ids.slice(0, limit).forEach(function (id) { keepIds[id] = true; });
    var nodes = {}; var edges = {};
    Object.keys(keepIds).forEach(function (id) { nodes[id] = f.nodes[id]; });
    Object.keys(f.edges).forEach(function (k) {
      var e = f.edges[k];
      if (keepIds[e.a] && keepIds[e.b]) edges[k] = e;
    });
    return { g: { nodes: nodes, edges: edges }, total: total, cut: true };
  }

  function forceLayout(nodes, edges, W, H) {
    var ids = Object.keys(nodes);
    var pos = {};
    var seed = 12345;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    ids.forEach(function (id) {
      pos[id] = { x: W / 2 + (rnd() - 0.5) * W * 0.8, y: H / 2 + (rnd() - 0.5) * H * 0.8, dx: 0, dy: 0 };
    });
    var k = Math.sqrt((W * H) / Math.max(ids.length, 1)) * 0.9;
    var iters = ids.length > 200 ? 120 : 200;
    var ek = Object.keys(edges).map(function (key) { return edges[key]; });
    for (var it = 0; it < iters; it++) {
      var temp = (W / 12) * (1 - it / iters) + 0.5;
      ids.forEach(function (a) { pos[a].dx = 0; pos[a].dy = 0; });
      for (var i = 0; i < ids.length; i++) {
        for (var j = i + 1; j < ids.length; j++) {
          var p = pos[ids[i]]; var q = pos[ids[j]];
          var dx = p.x - q.x; var dy = p.y - q.y;
          var d2 = dx * dx + dy * dy + 0.01;
          var f = (k * k) / d2;
          p.dx += dx * f; p.dy += dy * f; q.dx -= dx * f; q.dy -= dy * f;
        }
      }
      ek.forEach(function (e) {
        var p = pos[e.a]; var q = pos[e.b];
        var dx = p.x - q.x; var dy = p.y - q.y;
        var d = Math.sqrt(dx * dx + dy * dy) + 0.01;
        var f = (d * d) / k;
        p.dx -= dx / d * f; p.dy -= dy / d * f; q.dx += dx / d * f; q.dy += dy / d * f;
      });
      ids.forEach(function (id) {
        var p = pos[id];
        p.dx += (W / 2 - p.x) * 0.01; p.dy += (H / 2 - p.y) * 0.01;
        var m = Math.sqrt(p.dx * p.dx + p.dy * p.dy) + 0.01;
        var s = Math.min(m, temp) / m;
        p.x += p.dx * s; p.y += p.dy * s;
      });
    }
    return pos;
  }

  function layeredLayout(nodes, W, H) {
    var cols = { disc: 0, place: 1, org: 2, series: 3, signal: 4, athlete: 5, rb: 6, src: 7 };
    var by = {};
    Object.keys(nodes).forEach(function (id) {
      var k = cols[nodes[id].kind];
      (by[k] || (by[k] = [])).push(nodes[id]);
    });
    var pos = {};
    var colKeys = Object.keys(by).map(Number).sort(function (a, b) { return a - b; });
    colKeys.forEach(function (c, idx) {
      var list = by[c].sort(function (a, b) { return b.deg - a.deg || (a.label < b.label ? -1 : 1); });
      var x = 60 + idx * ((W - 120) / Math.max(colKeys.length - 1, 1));
      list.forEach(function (n, i) {
        pos[n.id] = { x: x, y: 40 + i * (H - 80) / Math.max(list.length - 1, 1) };
      });
    });
    return pos;
  }

  function viewConcept(el) {
    var st = { mode: "auto", limit: 300, sources: false, search: "", disc: "ALL", region: "ALL", sel: null,
      kinds: { disc: true, place: true, org: true, series: true, signal: true, athlete: true, rb: true, src: false } };
    var pz = null;
    var baseGraph = null;

    function render() {
      var g = buildGraph({ sources: st.sources });
      var f = filterGraph(g, { kinds: st.kinds, disc: st.disc, region: st.region });
      var lim = limitGraph(f, st.limit);
      var graph = lim.g;
      var ids = Object.keys(graph.nodes);
      var mode = st.mode === "auto" ? (ids.length <= 400 ? "force" : "layered") : st.mode;
      var W = 1000; var H = 700;
      var pos = mode === "force" ? forceLayout(graph.nodes, graph.edges, W, H) : layeredLayout(graph.nodes, W, H);
      // Normalise to the drawing area.
      var minX = Infinity; var minY = Infinity; var maxX = -Infinity; var maxY = -Infinity;
      ids.forEach(function (id) {
        var p = pos[id]; if (!p) return;
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      });
      if (!ids.length) { minX = 0; minY = 0; maxX = W; maxY = H; }
      var sx = (W - 80) / Math.max(maxX - minX, 1); var sy = (H - 80) / Math.max(maxY - minY, 1);
      var s = mode === "force" ? Math.min(sx, sy) : 1;
      ids.forEach(function (id) {
        var p = pos[id];
        if (!p) return;
        p.X = 40 + (p.x - minX) * s + (mode === "force" ? ((W - 80) - (maxX - minX) * s) / 2 : 0);
        p.Y = 40 + (p.y - minY) * s + (mode === "force" ? ((H - 80) - (maxY - minY) * s) / 2 : 0);
      });

      var edgeSvg = Object.keys(graph.edges).map(function (k) {
        var e = graph.edges[k];
        var pa = pos[e.a]; var pb = pos[e.b];
        if (!pa || !pb) return "";
        return '<line class="edge ' + EV_STYLE[e.ev] + '" data-a="' + esc(e.a) + '" data-b="' + esc(e.b) +
          '" x1="' + pa.X.toFixed(1) + '" y1="' + pa.Y.toFixed(1) + '" x2="' + pb.X.toFixed(1) + '" y2="' + pb.Y.toFixed(1) +
          '"><title>' + esc(e.ev.replace(/_/g, " ")) + "</title></line>";
      }).join("");
      var nodeSvg = ids.map(function (id) {
        var n = graph.nodes[id]; var p = pos[id];
        var r = 4 + Math.min(n.deg, 12) * 0.6;
        return '<g class="node k-' + n.kind + '" data-node="' + esc(id) + '"><circle cx="' + p.X.toFixed(1) + '" cy="' +
          p.Y.toFixed(1) + '" r="' + r.toFixed(1) + '"><title>' + esc(KIND_LABEL[n.kind] + ": " + n.label) + "</title></circle></g>";
      }).join("");
      // Labels: highest degree first, skip any label that would overlap one already placed.
      var placed = []; var labelSvg = "";
      ids.slice().sort(function (a, b) { return graph.nodes[b].deg - graph.nodes[a].deg || (a < b ? -1 : 1); }).forEach(function (id) {
        var n = graph.nodes[id]; var p = pos[id];
        var text = n.label.length > 26 ? n.label.slice(0, 25) + "…" : n.label;
        var w = text.length * 7.4; var x = p.X + 8; var y = p.Y + 4;
        var box = { x1: x - 2, y1: y - 15, x2: x + w + 2, y2: y + 6 };
        var clash = placed.some(function (b) { return !(box.x2 < b.x1 || box.x1 > b.x2 || box.y2 < b.y1 || box.y1 > b.y2); });
        if (clash) return;
        placed.push(box);
        labelSvg += '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" data-l="' + esc(id) + '">' + esc(text) + "</text>";
      });

      var typeChecks = Object.keys(KIND_LABEL).map(function (k) {
        return '<label class="chk"><input type="checkbox" data-kind="' + k + '"' + (st.kinds[k] ? " checked" : "") + "> " + esc(KIND_LABEL[k]) + "</label>";
      }).join("");
      var discOpts = '<option value="ALL">All disciplines</option>' + DISCS.filter(function (d) { return d.disc_id !== "ALL"; }).map(function (d) {
        return '<option value="' + esc(d.disc_id) + '"' + (st.disc === d.disc_id ? " selected" : "") + ">" + esc(d.discipline) + "</option>";
      }).join("");
      var regOpts = '<option value="ALL">All regions</option>' + REGION_ORDER.map(function (r) {
        return '<option value="' + r + '"' + (st.region === r ? " selected" : "") + ">" + esc(r.replace(/_/g, " ")) + "</option>";
      }).join("");
      var cut = lim.cut ? '<p class="warn">Showing ' + ids.length + " of " + lim.total + " nodes (the most connected ones). Narrow the filters or raise the limit to see more.</p>" : "";
      var big = ids.length > 800 ? '<p class="note">Large graph: a plain layout is used.</p>' : "";

      el.innerHTML =
        "<h1>Concept map</h1>" +
        '<p class="muted">How the data items connect. Lines are derived from the links between rows (an event to its place, organiser and series; a fact to its place, discipline and signal; relations from relations.csv). Line style = evidence: solid = found, dashed = stated or inferred, dotted = not found. Click a node for its rows and neighbours.</p>' +
        '<div class="ctrl">' +
        '<label>Search <input id="cq" type="search" value="' + esc(st.search) + '" placeholder="name"></label>' +
        '<label>Layout <select id="cmode"><option value="auto"' + (st.mode === "auto" ? " selected" : "") + '>automatic</option><option value="force"' + (st.mode === "force" ? " selected" : "") + '>force</option><option value="layered"' + (st.mode === "layered" ? " selected" : "") + ">layered</option></select></label>" +
        '<label>Limit <input id="climit" type="number" min="20" max="2000" step="50" value="' + st.limit + '"> nodes</label>' +
        '<label>Discipline <select id="cdisc">' + discOpts + "</select></label>" +
        '<label>Region <select id="creg">' + regOpts + "</select></label>" +
        '<label class="chk"><input id="csrc" type="checkbox"' + (st.sources ? " checked" : "") + "> Show sources</label>" +
        '<button type="button" id="creset">Reset view</button></div>' +
        '<div class="ctrl kinds">' + typeChecks + "</div>" +
        cut + big +
        '<div class="legend"><span class="legend-line e-solid"></span> found <span class="legend-line e-dash"></span> stated or inferred <span class="legend-line e-dot"></span> not found</div>' +
        '<div class="mapwrap"><svg id="csvg" class="concept" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Concept map">' +
        edgeSvg + nodeSvg + labelSvg + "</svg></div>" +
        '<p class="note">Nodes: ' + ids.length + " · links: " + Object.keys(graph.edges).length + ". Isolated items are hidden. Mouse wheel zooms, drag pans.</p>";

      var svg = document.getElementById("csvg");
      pz = panZoom(svg, { x: 0, y: 0, w: W, h: H });
      document.getElementById("cq").oninput = function (e) { st.search = e.target.value; highlight(); };
      document.getElementById("cmode").onchange = function (e) { st.mode = e.target.value; render(); };
      document.getElementById("climit").onchange = function (e) { st.limit = Math.max(20, Math.min(2000, Number(e.target.value) || 300)); render(); };
      document.getElementById("cdisc").onchange = function (e) { st.disc = e.target.value; render(); };
      document.getElementById("creg").onchange = function (e) { st.region = e.target.value; render(); };
      document.getElementById("csrc").onchange = function (e) { st.sources = e.target.checked; st.kinds.src = e.target.checked; render(); };
      document.getElementById("creset").onclick = function () { pz.reset({ x: 0, y: 0, w: W, h: H }); };
      el.querySelectorAll("input[data-kind]").forEach(function (c) {
        c.onchange = function () { st.kinds[c.getAttribute("data-kind")] = c.checked; render(); };
      });
      baseGraph = graph;
      highlight();
      svg.onclick = function (e) {
        var n = e.target.closest ? e.target.closest("g[data-node]") : null;
        if (!n) return;
        st.sel = n.getAttribute("data-node");
        highlight();
        showNode(graph, st.sel);
      };
      if (st.sel && graph.nodes[st.sel]) showNode(graph, st.sel);
    }

    function highlight() {
      var svg = document.getElementById("csvg");
      if (!svg) return;
      var q = st.search.trim().toLowerCase();
      var sel = st.sel;
      var neigh = {};
      if (sel && baseGraph && baseGraph.nodes[sel]) {
        neigh[sel] = true;
        Object.keys(baseGraph.edges).forEach(function (k) {
          var e = baseGraph.edges[k];
          if (e.a === sel) neigh[e.b] = true;
          if (e.b === sel) neigh[e.a] = true;
        });
      }
      svg.querySelectorAll("g[data-node]").forEach(function (g) {
        var id = g.getAttribute("data-node");
        var label = baseGraph && baseGraph.nodes[id] ? baseGraph.nodes[id].label.toLowerCase() : "";
        var hit = !q || label.indexOf(q) >= 0;
        var dim = (sel && !neigh[id]) || (q && !hit);
        g.classList.toggle("dim", !!dim);
        g.classList.toggle("sel", id === sel);
      });
      svg.querySelectorAll("line.edge").forEach(function (l) {
        var dim = sel && l.getAttribute("data-a") !== sel && l.getAttribute("data-b") !== sel;
        l.classList.toggle("dim", !!dim);
      });
      svg.querySelectorAll("text[data-l]").forEach(function (t) {
        t.classList.toggle("dim", !!(sel && !neigh[t.getAttribute("data-l")]));
      });
    }

    function showNode(graph, id) {
      var n = graph.nodes[id];
      if (!n) return;
      var neighbours = {};
      Object.keys(graph.edges).forEach(function (k) {
        var e = graph.edges[k];
        if (e.a === id) neighbours[e.b] = graph.nodes[e.b];
        if (e.b === id) neighbours[e.a] = graph.nodes[e.a];
      });
      var byKind = {};
      Object.keys(neighbours).forEach(function (nid) {
        var nb = neighbours[nid];
        (byKind[nb.kind] || (byKind[nb.kind] = [])).push(nb);
      });
      var extra = "";
      if (n.kind === "series") {
        var evs = EVENTS.filter(function (ev) { return "s:" + ev.series === id; });
        extra = "<h3>Events in this series (" + evs.length + ")</h3>" + listRows("events.csv", evs, "No events.");
      }
      var rowHtml = n.row ? '<p><a href="#" data-reg="' + A.registerRow(n.table, n.row) + '">Open this row</a></p>' : "";
      var nb = KIND_ORDER.filter(function (k) { return byKind[k]; }).map(function (k) {
        return "<h4>" + esc(KIND_LABEL[k]) + " (" + byKind[k].length + ")</h4><ul class=\"plain\">" +
          byKind[k].slice(0, 60).map(function (x) { return "<li>" + esc(x.label) + "</li>"; }).join("") +
          (byKind[k].length > 60 ? "<li>… and " + (byKind[k].length - 60) + " more</li>" : "") + "</ul>";
      }).join("");
      A.openPanel(n.label, '<p class="muted">' + esc(KIND_LABEL[n.kind]) + " · " + Object.keys(neighbours).length + " linked items</p>" +
        rowHtml + extra + "<h3>Linked items</h3>" + (nb || '<p class="note">No links.</p>'));
    }

    render();
  }

  /* ---------- sources ---------- */
  function viewSources(el) {
    var st = { filter: "all", q: "" };
    function draw() {
      var rows = SOURCES.filter(function (s) {
        if (st.filter === "never" && s.access_status !== "not_opened") return false;
        if (st.filter === "blocked" && s.access_status !== "blocked") return false;
        if (st.filter === "opened" && s.access_status !== "opened" && s.access_status !== "rendered") return false;
        if (st.q) {
          var text = [s.title, s.publisher, s.url, s.notes].join(" ").toLowerCase();
          if (text.indexOf(st.q.toLowerCase()) < 0) return false;
        }
        return true;
      });
      var usage = {};
      var uses = { facts: "facts.csv", events: "events.csv", organisations: "organisations.csv",
        athletes: "athletes.csv", redbull_finance: "redbull_finance.csv", relations: "relations.csv" };
      Object.keys(uses).forEach(function (k) {
        T[uses[k]].forEach(function (r) {
          var id = r.source_id || r.website_source_id;
          if (!id) return;
          usage[id] = usage[id] || {};
          usage[id][uses[k]] = (usage[id][uses[k]] || 0) + 1;
        });
      });
      var groups = {};
      rows.forEach(function (s) { (groups[s.source_type] || (groups[s.source_type] = [])).push(s); });
      var html = Object.keys(groups).sort().map(function (type) {
        return "<h2>" + esc(type) + " (" + groups[type].length + ")</h2>" +
          '<div class="hscroll"><table class="data small"><thead><tr><th>Title</th><th>Status</th><th>Opened</th><th>Rows that use it</th></tr></thead><tbody>' +
          groups[type].map(function (s) {
            var u = usage[s.source_id] || {};
            var used = Object.keys(u).map(function (t) {
              var col = t === "organisations.csv" ? "website_source_id" : "source_id";
              return '<a href="#" data-src-table="' + esc(t) + '" data-col="' + col + '" data-src="' + esc(s.source_id) + '">' +
                esc(A.FILE_LABEL[t] || t) + " " + u[t] + "</a>";
            }).join(", ");
            return '<tr><td><a href="#" data-reg="' + A.registerRow("sources.csv", s) + '">' + esc(s.title) + "</a><br><span class=\"code\">" +
              esc(s.url) + "</span></td><td>" + badge("access_status", s.access_status) + "</td><td>" + esc(s.access_date || "not opened") +
              "</td><td>" + (used || '<span class="muted">none</span>') + "</td></tr>";
          }).join("") + "</tbody></table></div>";
      }).join("") || '<p class="note">No sources match this filter.</p>';
      el.innerHTML =
        "<h1>Sources</h1>" +
        '<p class="muted">Every source with its access status. "Never opened" and "blocked" sources must not be trusted for values. Click a title for its row; click a count to see the rows that use it.</p>' +
        '<div class="ctrl"><label>Show <select id="sf">' +
        [["all", "All"], ["never", "Never opened"], ["blocked", "Blocked"], ["opened", "Opened or rendered"]].map(function (o) {
          return '<option value="' + o[0] + '"' + (st.filter === o[0] ? " selected" : "") + ">" + o[1] + "</option>";
        }).join("") + '</select></label><label>Search <input id="sq" type="search" value="' + esc(st.q) + '"></label></div>' +
        html;
      document.getElementById("sf").onchange = function (e) { st.filter = e.target.value; draw(); };
      document.getElementById("sq").oninput = function (e) { st.q = e.target.value; draw(); };
      el.onclick = function (e) {
        var a = e.target.closest ? e.target.closest("a[data-src-table]") : null;
        if (!a) return;
        e.preventDefault();
        A.openTableFilter(a.getAttribute("data-src-table"), a.getAttribute("data-col"), a.getAttribute("data-src"));
      };
    }
    draw();
  }

  /* ---------- about ---------- */
  function viewAbout(el) {
    var S = (window.ATLAS_DATA.schema) || {};
    function text(key) { return S[key] ? esc(S[key]).replace(/`([^`]+)`/g, "<code>$1</code>") : "(see data_schema.md)"; }
    var rows = [
      ["evidence_type", "Evidence type"], ["confidence", "Confidence"], ["access_status", "Access status"],
      ["red_bull_involvement", "Red Bull involvement"]
    ].map(function (k) {
      return "<h3>" + esc(k[1]) + " <span class=\"code\">" + esc(k[0]) + "</span></h3><p>" + text(k[0]) + "</p>";
    }).join("");
    var counts = A.TABLE_NAMES.map(function (tn) {
      return "<li>" + esc(A.FILE_LABEL[tn]) + ": " + T[tn].length + " rows</li>";
    }).join("");
    el.innerHTML =
      "<h1>About this page</h1>" +
      '<p>This page shows the data of the Dance Scene Atlas. It is view only: nothing can be edited here. Corrections are made in the CSV files, then the page is rebuilt.</p>' +
      "<h2>How to read it</h2><ul>" +
      "<li><b>Overview</b>: data quality, gaps and conflicts.</li>" +
      "<li><b>City comparison</b>: the 15 deep cities side by side for breaking, salsa and bachata, one signal at a time, with a check of whether the values can be compared.</li>" +
      "<li><b>Breaking vs Latin</b>: what the data says about the size of each world (online interest, large events, national figures, Red Bull footprint) and what is still missing.</li>" +
      "<li><b>Tables</b>: every CSV file. Search, filter, sort, show or hide columns; click a row for its source and related rows.</li>" +
      "<li><b>Grid</b>: places × disciplines, counts only.</li>" +
      "<li><b>Geographic map</b>: places with coordinates; circle size is a count.</li>" +
      "<li><b>Concept map</b>: how items connect.</li>" +
      "<li><b>Sources</b>: every source with its access status.</li></ul>" +
      "<h2>Legend and definitions</h2>" +
      '<p class="muted">Taken from the data contract (project/data_schema.md, section 2).</p>' + rows +
      "<h3>Rules</h3><p>" + text("rule_absent") + "</p>" +
      '<p><b>No scores are shown: raw evidence only.</b> No rankings, no composite indexes. The two analysis views add only plain sums and ratios, labelled as computed.</p>' +
      "<h2>This build</h2><ul>" +
      "<li>Built: " + esc(BUILD.date) + " from " + esc(BUILD.source) + "</li>" +
      "<li>Fingerprint: " + esc(BUILD.fingerprint) + "</li>" +
      "<li>Counts:</li></ul><ul>" + counts + "</ul>";
  }

  /* ---------- register and start ---------- */
  A.registerViewFn("overview", viewOverview);
  A.registerViewFn("grid", viewGrid);
  A.registerViewFn("map", viewMap);
  A.registerViewFn("concept", viewConcept);
  A.registerViewFn("sources", viewSources);
  A.registerViewFn("about", viewAbout);
  window.ATLAS_START();
})();

</script>
</body>
</html>
